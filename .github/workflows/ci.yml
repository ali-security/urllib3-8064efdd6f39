name: CI

on:
  workflow_dispatch:

permissions: read-all

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check packages
        run: |
          python -m pip install pip "setuptools<68" "wheel==0.38.4" twine rstcheck;
          python setup.py sdist bdist_wheel;
          rstcheck README.rst CHANGES.rst
          python -m twine check dist/*
        env:
          PIP_INDEX_URL: https://:2023-03-11@time-machines-pypi.sealsecurity.io/
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
        os: [ubuntu-latest, macos-latest, windows-latest]
        nox-session: ['']

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} ${{ matrix.python-version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python - ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: python -m pip install --upgrade pip setuptools nox

      - name: Run Tests
        run: ./ci/run_tests.sh
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          NOX_SESSION: ${{ matrix.nox-session }}
          PIP_INDEX_URL: https://:2023-03-11@time-machines-pypi.sealsecurity.io/
